<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dubtitles</title>
    <style>
      /* Paint the popup chrome in the right theme before Vue mounts — the
         `.dark` class lands in main.ts, and MV3's CSP forbids inline scripts. */
      html,
      body {
        margin: 0;
        width: 360px;
        background: oklch(1 0 0);
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: oklch(0.145 0 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
